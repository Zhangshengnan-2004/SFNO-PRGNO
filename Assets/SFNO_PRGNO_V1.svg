<polyline points="1500,275 1500,140" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="810" y="85" width="725" height="55" rx="9" fill="#d8ecc5" stroke="#64748b"/>
<text x="1172.5" y="118.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Feature Concatenation: [x1, x2, x3, x4] → 256 channels</text>
<polyline points="1475,275 1500,275" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1560" y="235" width="135" height="80" rx="9" fill="#fbe0e7" stroke="#64748b"/>
<text x="1627.5" y="258.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">1×1 Conv</text>
<text x="1627.5" y="281.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">256 → 31</text>
<text x="1627.5" y="304.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">LeakyReLU</text>
<polyline points="1535,112 1627,112 1627,235" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="1715" y="247" width="60" height="55" rx="9" fill="#e7effa" stroke="#64748b"/>
