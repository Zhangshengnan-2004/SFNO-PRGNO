<polyline points="1695,275 1715,275" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="320,155 330,155 330,65 1745,65 1745,247" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="1745,302 1745,355" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1710" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">HR-HSI (31 bands)</text>
<text x="900" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Guidance uses one shared reconstruction head and one shared residual lift; ΔQ/ΔK projections are per block.</text>
<rect x="20" y="510" width="800" height="420" rx="14" fill="#fafcff" stroke="#94a3b8" stroke-dasharray="7 5"/>
<text x="420.0" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">(a) Physical Residual Guidance — shared across stages</text>
<rect x="40" y="575" width="155" height="70" rx="9" fill="#e7effa" stroke="#64748b"/>
<text x="117.5" y="604.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Feature xk</text>
<text x="117.5" y="627.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">64 channels</text>
<rect x="225" y="575" width="190" height="70" rx="9" fill="#fbe0e7" stroke="#64748b"/>
<text x="320.0" y="604.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Shared 1×1 Conv</text>
<text x="320.0" y="627.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">64 → 31</text>
<polyline points="195,610 225,610" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="450" y="575" width="330" height="70" rx="9" fill="#ffe5c2" stroke="#64748b"/>
<text x="615.0" y="604.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Xk = L_up + Conv(xk)</text>
<text x="615.0" y="627.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Intermediate HSI estimate</text>
<polyline points="415,610 450,610" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="45" y="685" width="345" height="85" rx="9" fill="#ffe5c2" stroke="#64748b"/>
<text x="217.5" y="710.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Spatial residual: L − DB(Xk)</text>
<text x="217.5" y="733.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Backprojection: (DB)*</text>
<text x="217.5" y="756.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">LR-HSI consistency</text>
<rect x="430" y="685" width="345" height="85" rx="9" fill="#ffe5c2" stroke="#64748b"/>
<text x="602.5" y="710.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Spectral residual: M − R Xk</text>
<text x="602.5" y="733.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Backprojection: Rᵀ</text>
<text x="602.5" y="756.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">HR-MSI consistency</text>
<polyline points="615,645 615,665 220,665 220,685" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="615,645 615,685" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="235" y="805" width="365" height="75" rx="9" fill="#ffe5c2" stroke="#64748b"/>
<text x="417.5" y="837.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Sum of backprojected residuals</text>
<text x="417.5" y="860.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Shared 1×1 Conv: 31 → 64 → gk</text>
<polyline points="220,770 220,842 235,842" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="602,770 602,842 600,842" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="420" y="910" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#172033">R: fixed training-set fitted effective response; DB: matched spatial degradation</text>
<rect x="845" y="510" width="360" height="420" rx="14" fill="#fafcff" stroke="#94a3b8" stroke-dasharray="7 5"/>
<text x="1025.0" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">(b) PhysicsIntegral</text>
<rect x="895" y="575" width="260" height="60" rx="9" fill="#e7effa" stroke="#64748b"/>
<text x="1025.0" y="611.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Input xk (64 channels)</text>
<rect x="895" y="675" width="260" height="70" rx="9" fill="#e7effa" stroke="#64748b"/>
<text x="1025.0" y="704.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Progressive Resampling</text>
<text x="1025.0" y="727.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">8 heads; ssl = 4 / 4 / 2</text>
<polyline points="1025,635 1025,675" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="895" y="780" width="260" height="65" rx="9" fill="#e7effa" stroke="#64748b"/>
<text x="1025.0" y="807.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">PhysicsGuidedGalerkin</text>
<text x="1025.0" y="830.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Receives gk</text>
<polyline points="1025,745 1025,780" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<polyline points="1025,845 1025,880" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#a)"/>
<text x="1025" y="902" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#172033">Output x(k+1) = GI(PR(xk), gk) + xk</text>
<rect x="1230" y="510" width="550" height="420" rx="14" fill="#fafcff" stroke="#94a3b8" stroke-dasharray="7 5"/>
<text x="1505.0" y="542" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#172033">(c) PhysicsGuidedGalerkin</text>
<text x="1505" y="580" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">z = PR(xk); Q, K, V = QKV projection(z)</text>
<text x="1505" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">(ΔQ, ΔK) = Conv₁×₁(gk): 64 → 128</text>
<text x="1505" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Q′ = Q + ΔQ; K′ = K + ΔK</text>
<text x="1505" y="715" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">K̄ = Norm(K′); V̄ = Norm(V)</text>
<text x="1505" y="760" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">T = Q′ (K̄ᵀ V̄ / N),  N = H × W</text>
<text x="1505" y="805" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">U = T + z</text>
<text x="1505" y="850" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">Output = Conv2(GELU(Conv1(U))) + z</text>
<text x="1505" y="895" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#172033">ΔQ/ΔK projection: zero initialized</text>
<text x="900" y="973" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#172033">Main output = LeakyReLU(Conv₁×₁(Concat(x1, x2, x3, x4))) + L_up</text>
</svg>