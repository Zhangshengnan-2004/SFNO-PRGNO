<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1500" viewBox="0 0 1800 1500" role="img" aria-labelledby="title desc">
<title id="title">V3-stage3 物理引导模块</title>
<desc id="desc">第 j 阶段输入特征经过共享中间重建头，与上采样 HSI 相加形成估计。分别与 LR-HSI、HR-MSI 计算观测减预测残差，经空间与光谱伴随回投后相加，通过共享 1×1 卷积生成 64 通道物理引导。引导仅调制 GI 的 Q 和 K。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#51647a"/></marker></defs>
<style>text{font-family:'Noto Sans CJK SC',Arial,sans-serif;fill:#23344b} .wire{fill:none;stroke:#51647a;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round} .guide{stroke-dasharray:7 5}</style><rect width="1800" height="1500" fill="#f4f7fb"/>
<text x="40" y="53" font-size="34" font-weight="700" text-anchor="start" style="fill:#23344b">V3-stage3 | 物理引导模块</text>
<text x="40" y="88" font-size="18" font-weight="400" text-anchor="start" style="fill:#61738a">j = 1, 2, 3；Ch = HSI 通道数，Cm = MSI 通道数；图中省略 batch 维 B；空间与光谱残差均开启。</text>
<rect x="30" y="120" width="1740" height="305" rx="18" fill="white" stroke="#dce3ed"/>
<text x="55" y="157" font-size="23" font-weight="700" text-anchor="start" style="fill:#23344b">A  共享中间重建头：从当前阶段特征生成 HSI 估计</text>
<g><rect x="65" y="180" width="230" height="70" rx="12" fill="#edf3ff" stroke="#b1c5eb" stroke-width="1.5"/>
<text x="180.0" y="208.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">阶段输入 F[j−1]</text>
<text x="180.0" y="233.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">64 × H × W</text>
</g>
<g><rect x="340" y="180" width="250" height="70" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="465.0" y="208.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">共享中间重建头</text>
<text x="465.0" y="233.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">1×1 卷积：64 → Ch</text>
</g>
<polyline points="295,215 340,215" class="wire" marker-end="url(#arrow)"/>
<polyline points="590,215 638,215" class="wire" marker-end="url(#arrow)"/>
<g id="estimate-add"><circle cx="660" cy="215" r="22" fill="white" stroke="#51647a" stroke-width="2.2"/>
<text x="660" y="224" font-size="30" font-weight="700" text-anchor="middle" style="fill:#23344b">+</text>
</g>
<g><rect x="735" y="180" width="290" height="70" rx="12" fill="#eaf5ee" stroke="#a1ceb3" stroke-width="1.5"/>
<text x="880.0" y="208.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">中间 HSI 估计 X̂[j]</text>
<text x="880.0" y="233.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">Ch × H × W</text>
</g>
<polyline points="682,215 735,215" class="wire" marker-end="url(#arrow)"/>
<g><rect x="65" y="320" width="230" height="70" rx="12" fill="#edf3ff" stroke="#b1c5eb" stroke-width="1.5"/>
<text x="180.0" y="348.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">LR-HSI：Yh</text>
<text x="180.0" y="373.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">Ch × h × w</text>
</g>
<g><rect x="340" y="320" width="250" height="70" rx="12" fill="#edf3ff" stroke="#b1c5eb" stroke-width="1.5"/>
<text x="465.0" y="348.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">双三次上采样</text>
<text x="465.0" y="373.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">U：Ch × H × W</text>
</g>
<polyline points="295,355 340,355" class="wire" marker-end="url(#arrow)"/>
<polyline points="590,355 660,355 660,237" class="wire" marker-end="url(#arrow)"/>
<text x="1100" y="199" font-size="22" font-weight="700" text-anchor="start" style="fill:#23344b">X̂[j] = U + Head(F[j−1])</text>
<text x="1100" y="240" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">共享中间重建头的权重、偏置均为零初始化。</text>
<text x="1100" y="281" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">因此训练开始时，X̂[j] = U。</text>
<text x="1100" y="340" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">每阶段使用各自输入特征重新生成估计；</text>
<text x="1100" y="374" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">三个阶段共享重建头参数。</text>
<rect x="30" y="445" width="1740" height="565" rx="18" fill="white" stroke="#dce3ed"/>
<text x="55" y="482" font-size="23" font-weight="700" text-anchor="start" style="fill:#23344b">B  观测残差与伴随回投：当前估计与两路真实观测分别比较</text>
<g><rect x="65" y="665" width="250" height="80" rx="12" fill="#eaf5ee" stroke="#a1ceb3" stroke-width="1.5"/>
<text x="190.0" y="698.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">中间 HSI 估计 X̂[j]</text>
<text x="190.0" y="723.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">来自 A；Ch × H × W</text>
</g>
<polyline points="315,705 350,705 350,600 400,600" class="wire" marker-end="url(#arrow)"/>
<polyline points="350,705 350,840 400,840" class="wire" marker-end="url(#arrow)"/>
<circle cx="350" cy="705" r="3.6" fill="#51647a"/>
<g><rect x="400" y="560" width="270" height="80" rx="12" fill="#eaf5ee" stroke="#a1ceb3" stroke-width="1.5"/>
<text x="535.0" y="593.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">空间退化 D</text>
<text x="535.0" y="618.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">模糊 + 按 LR 网格采样</text>
</g>
<text x="535" y="670" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">预测 LR-HSI：Ch × h × w</text>
<g><rect x="700" y="485" width="200" height="65" rx="12" fill="#edf3ff" stroke="#b1c5eb" stroke-width="1.5"/>
<text x="800.0" y="511.0" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">LR-HSI：Yh</text>
<text x="800.0" y="536.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">真实空间观测</text>
</g>
<g id="spatial-subtract"><circle cx="800" cy="600" r="22" fill="white" stroke="#51647a" stroke-width="2.2"/>
<text x="800" y="609" font-size="30" font-weight="700" text-anchor="middle" style="fill:#23344b">−</text>
</g>
<polyline points="670,600 778,600" class="wire" marker-end="url(#arrow)"/>
<polyline points="800,550 800,578" class="wire" marker-end="url(#arrow)"/>
<text x="820" y="568" font-size="18" font-weight="700" text-anchor="middle" style="fill:#23344b">+</text>
<text x="755" y="586" font-size="18" font-weight="700" text-anchor="middle" style="fill:#23344b">−</text>
<text x="800" y="655" font-size="18" font-weight="400" text-anchor="middle" style="fill:#23344b">rₛ = Yh − D(X̂[j])</text>
<g><rect x="930" y="560" width="270" height="80" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="1065.0" y="593.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">空间伴随回投 D*</text>
<text x="1065.0" y="618.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">rₛ → Ch × H × W</text>
</g>
<polyline points="822,600 930,600" class="wire" marker-end="url(#arrow)"/>
<g><rect x="400" y="800" width="270" height="80" rx="12" fill="#eaf5ee" stroke="#a1ceb3" stroke-width="1.5"/>
<text x="535.0" y="833.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">光谱响应 R</text>
<text x="535.0" y="858.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">固定矩阵：Cm × Ch</text>
</g>
<text x="535" y="910" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">预测 HR-MSI：Cm × H × W</text>
<g><rect x="700" y="725" width="200" height="65" rx="12" fill="#edf3ff" stroke="#b1c5eb" stroke-width="1.5"/>
<text x="800.0" y="751.0" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">HR-MSI：Ym</text>
<text x="800.0" y="776.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">真实光谱观测</text>
</g>
<g id="spectral-subtract"><circle cx="800" cy="840" r="22" fill="white" stroke="#51647a" stroke-width="2.2"/>
<text x="800" y="849" font-size="30" font-weight="700" text-anchor="middle" style="fill:#23344b">−</text>
</g>
<polyline points="670,840 778,840" class="wire" marker-end="url(#arrow)"/>
<polyline points="800,790 800,818" class="wire" marker-end="url(#arrow)"/>
<text x="820" y="808" font-size="18" font-weight="700" text-anchor="middle" style="fill:#23344b">+</text>
<text x="755" y="826" font-size="18" font-weight="700" text-anchor="middle" style="fill:#23344b">−</text>
<text x="800" y="895" font-size="18" font-weight="400" text-anchor="middle" style="fill:#23344b">rₘ = Ym − R(X̂[j])</text>
<g><rect x="930" y="800" width="270" height="80" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="1065.0" y="833.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">光谱伴随回投 Rᵀ</text>
<text x="1065.0" y="858.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">rₘ → Ch × H × W</text>
</g>
<polyline points="822,840 930,840" class="wire" marker-end="url(#arrow)"/>
<g id="backprojection-add"><circle cx="1350" cy="720" r="22" fill="white" stroke="#51647a" stroke-width="2.2"/>
<text x="1350" y="729" font-size="30" font-weight="700" text-anchor="middle" style="fill:#23344b">+</text>
</g>
<polyline points="1200,600 1350,600 1350,698" class="wire" marker-end="url(#arrow)"/>
<polyline points="1200,840 1350,840 1350,742" class="wire" marker-end="url(#arrow)"/>
<text x="1350" y="898" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">两项直接相加</text>
<text x="1350" y="929" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">无独立加权系数</text>
<g><rect x="1450" y="680" width="270" height="80" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="1585.0" y="713.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">共享通道提升层</text>
<text x="1585.0" y="738.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">1×1 卷积：Ch → 64</text>
</g>
<polyline points="1372,720 1450,720" class="wire" marker-end="url(#arrow)"/>
<g><rect x="1450" y="830" width="270" height="70" rx="12" fill="#f2edfc" stroke="#c1afe3" stroke-width="1.5"/>
<text x="1585.0" y="858.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">物理引导 G[j]</text>
<text x="1585.0" y="883.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">64 × H × W</text>
</g>
<polyline points="1585,760 1585,830" class="wire" marker-end="url(#arrow)"/>
<text x="930" y="981" font-size="23" font-weight="700" text-anchor="middle" style="fill:#23344b">G[j] = Lift( D*(Yh − D(X̂[j])) + Rᵀ(Ym − R(X̂[j])) )</text>
<rect x="30" y="1030" width="1740" height="300" rx="18" fill="white" stroke="#dce3ed"/>
<text x="55" y="1067" font-size="23" font-weight="700" text-anchor="start" style="fill:#23344b">C  物理引导的去向：调制物理引导积分的 Q、K（本区调制层属于各阶段 GI）</text>
<g><rect x="80" y="1110" width="270" height="85" rx="12" fill="#f2edfc" stroke="#c1afe3" stroke-width="1.5"/>
<text x="215.0" y="1146.0" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">物理引导 G[j]</text>
<text x="215.0" y="1171.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">来自 B；64 × H × W</text>
</g>
<g><rect x="450" y="1110" width="290" height="85" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="595.0" y="1133.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">Q、K 调制层</text>
<text x="595.0" y="1158.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">1×1 卷积：64 → 128</text>
<text x="595.0" y="1183.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">拆分为 ΔQ、ΔK</text>
</g>
<polyline points="350,1152 450,1152" class="wire guide" marker-end="url(#arrow)"/>
<g><rect x="1000" y="1100" width="350" height="95" rx="12" fill="#fff3e2" stroke="#ddbe90" stroke-width="1.5"/>
<text x="1175.0" y="1128.5" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">物理引导积分</text>
<text x="1175.0" y="1153.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">Q′ = Q + ΔQ；K′ = K + ΔK</text>
<text x="1175.0" y="1178.5" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">V 来自混合特征 M[j]</text>
</g>
<polyline points="740,1152 1000,1152" class="wire guide" marker-end="url(#arrow)"/>
<g><rect x="1030" y="1230" width="290" height="65" rx="12" fill="#eaf5ee" stroke="#a1ceb3" stroke-width="1.5"/>
<text x="1175.0" y="1256.0" font-size="21" font-weight="700" text-anchor="middle" style="fill:#23344b">混合特征 M[j]</text>
<text x="1175.0" y="1281.0" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">64 × H × W</text>
</g>
<polyline points="1175,1230 1175,1195" class="wire" marker-end="url(#arrow)"/>
<text x="1555" y="1103" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">输出进入该阶段的</text>
<text x="1555" y="1132" font-size="17" font-weight="400" text-anchor="middle" style="fill:#23344b">特征残差与后续重建</text>
<polyline points="1350,1147 1555,1147 1555,1220" class="wire" marker-end="url(#arrow)"/>
<text x="1555" y="1252" font-size="18" font-weight="700" text-anchor="middle" style="fill:#23344b">阶段后续计算</text>
<text x="70" y="1250" font-size="17" font-weight="400" text-anchor="start" style="fill:#23344b">虚线：物理引导 / 调制路径；实线：特征或观测路径。</text>
<text x="70" y="1287" font-size="17" font-weight="400" text-anchor="start" style="fill:#23344b">Q、K 调制层零初始化；各阶段 GI 参数独立。</text>
<text x="40" y="1375" font-size="19" font-weight="700" text-anchor="start" style="fill:#23344b">共享范围：A 中的中间重建头、B 中的物理算子与通道提升层；j = 1, 2, 3 都执行物理引导。</text>
<text x="40" y="1412" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">D* 是伴随算子，并非逆算子；D 与 R 按数据集配置。CAVE 的 R 是训练集拟合的有效响应。</text>
<text x="40" y="1449" font-size="18" font-weight="400" text-anchor="start" style="fill:#23344b">物理引导生成 G[j] 后送入 GI，不直接与阶段输出相加；本图对应 guidance_mode=&quot;physics&quot;。</text>
<text x="40" y="1481" font-size="15" font-weight="400" text-anchor="start" style="fill:#61738a">Source: FusionBackbone.py::_guidance · ObservationGrid.py::DynamicGuidance · PhysicsGalerkin.py::PhysicsGuidedGalerkin</text>
</svg>