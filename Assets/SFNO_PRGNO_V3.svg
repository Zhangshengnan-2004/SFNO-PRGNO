<text x="300" y="935" class="small" text-anchor="middle">Global: pooled 4-head self-attention → resize</text>
<rect x="65" y="955" width="470" height="62" rx="14" fill="#f0ebff" stroke="#b8a4de" stroke-width="1.5"/>
<text x="300.0" y="980.0" class="label" text-anchor="middle">Spatial + channel gates → Softmax over 4 branches</text>
<text x="300.0" y="1004.0" class="small" text-anchor="middle">Weighted sum → projection + residual → FFN + residual</text>
<polyline points="120,887 120,899" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="240,887 240,899" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="360,887 360,899" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="480,887 480,899" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="565" y="740" width="290" height="277" rx="14" fill="#e7f5f5" stroke="#99c7c7" stroke-width="1.5"/>
<text x="710.0" y="800.5" class="label" text-anchor="middle">Deformable branch</text>
<text x="710.0" y="824.5" class="small" text-anchor="middle">GroupNorm + log(HR/LR) condition</text>
<text x="710.0" y="848.5" class="small" text-anchor="middle">Predict 9 offsets + 9 weights</text>
<text x="710.0" y="872.5" class="small" text-anchor="middle">3×3 lattice × actual HR/LR spacing</text>
<text x="710.0" y="896.5" class="small" text-anchor="middle">Bounded offset: 0.5 × tanh(Δ)</text>
<text x="710.0" y="920.5" class="small" text-anchor="middle">Bilinear grid_sample + Softmax weights</text>
<text x="710.0" y="944.5" class="small" text-anchor="middle">Concat with local DWConv branch</text>
<text x="710.0" y="968.5" class="small" text-anchor="middle">1×1 projection + residual + FFN</text>
<rect x="65" y="1053" width="790" height="78" rx="14" fill="#ffffff" stroke="#b8a4de" stroke-width="1.5"/>
<text x="460.0" y="1086.0" class="label" text-anchor="middle">M(F) = Regional(F) + sigmoid(α) · [Deformable(F) − F]</text>
<text x="460.0" y="1110.0" class="small" text-anchor="middle">One learned scalar α per stage; α initialized to −3 (weight ≈ 0.0474)</text>
<polyline points="300,1017 300,1053" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="710,1017 710,1053" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="65" y="1158" class="small" text-anchor="start">* Capped at HR size. ×4 grids: {HR, HR/2, HR/4}; ×8: {HR, HR/4, HR/8}</text>
<rect x="905" y="678" width="660" height="505" rx="14" fill="#ffffff" stroke="#d7dfec" stroke-width="1.5"/>
<text x="928" y="713" class="label" text-anchor="start">D  Shared physics guidance</text>
<rect x="935" y="740" width="600" height="56" rx="14" fill="#fff2df" stroke="#d9bb89" stroke-width="1.5"/>
<text x="1235.0" y="774.0" class="label" text-anchor="middle">Current estimate: X̂ₖ = HSI_up + Conv₆₄→₃₁(Fₖ)</text>
<rect x="935" y="825" width="285" height="83" rx="14" fill="#fff8ed" stroke="#dfc69f" stroke-width="1.5"/>
<text x="1077.5" y="848.5" class="label" text-anchor="middle">Spatial residual</text>
<text x="1077.5" y="872.5" class="small" text-anchor="middle">rₛ = LR-HSI − D(X̂ₖ)</text>
<text x="1077.5" y="896.5" class="small" text-anchor="middle">D: dynamic Gaussian blur + sampling</text>
<rect x="1250" y="825" width="285" height="83" rx="14" fill="#fff8ed" stroke="#dfc69f" stroke-width="1.5"/>
<text x="1392.5" y="848.5" class="label" text-anchor="middle">Spectral residual</text>
<text x="1392.5" y="872.5" class="small" text-anchor="middle">rᵣ = HR-RGB − R(X̂ₖ)</text>
<text x="1392.5" y="896.5" class="small" text-anchor="middle">R: fixed fitted 3×31 response</text>
<polyline points="1080,796 1080,825" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1390,796 1390,825" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="935" y="940" width="600" height="63" rx="14" fill="#fff2df" stroke="#d9bb89" stroke-width="1.5"/>
<text x="1235.0" y="965.5" class="label" text-anchor="middle">Adjoint backprojection + 1×1 lift</text>
<text x="1235.0" y="989.5" class="small" text-anchor="middle">Gₖ = Conv₃₁→₆₄ [Dᵀ(rₛ) + Rᵀ(rᵣ)]</text>
<polyline points="1080,908 1080,940" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1390,908 1390,940" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="935" y="1035" width="600" height="79" rx="14" fill="#fff2df" stroke="#d9bb89" stroke-width="1.5"/>
<text x="1235.0" y="1056.5" class="label" text-anchor="middle">Galerkin: Q′ = Q + ΔQ(Gₖ),  K′ = K + ΔK(Gₖ)</text>
<text x="1235.0" y="1080.5" class="small" text-anchor="middle">Kernel = Norm(K′)ᵀ Norm(V) / (H·W)</text>
<text x="1235.0" y="1104.5" class="small" text-anchor="middle">Apply Q′ · Kernel → output projections + residuals</text>
<polyline points="1235,1003 1235,1035" fill="none" stroke="#53677e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="935" y="1145" class="small" text-anchor="start">Reconstruction head and physics module are shared across stages.</text>
<text x="935" y="1168" class="small" text-anchor="start">Current e600 experiment: spatial + spectral residuals enabled.</text>
